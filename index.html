<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="refresh" content="0; url=/preview/index.html"/>
  <meta name="viewport" content="width=device-width"/>
  <title>FOLDCUT — Cut Different. Wear Different.</title>
  <style>body{margin:0;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0A0A0A;color:#F8F7F5;}    /* --- BRAND IDENTITY ENHANCEMENTS --- */
    .fc-logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; user-select: none; }
    .fc-logo-emblem-wrap {
      width: 44px; height: 44px; border-radius: 50%; overflow: hidden;
      border: 1.5px solid var(--fc-accent);
      box-shadow: 0 2px 10px rgba(194, 132, 83, 0.25);
      flex-shrink: 0; background: var(--fc-white);
      display: flex; align-items: center; justify-content: center;
      transition: transform var(--fc-transition);
    }
    .fc-logo:hover .fc-logo-emblem-wrap { transform: scale(1.05) rotate(2deg); }
    .fc-logo-emblem { width: 100%; height: 100%; object-fit: cover; }
    .fc-logo-text-group { display: flex; flex-direction: column; align-items: flex-start; }
    .fc-logo-name {
      font-family: var(--fc-font-display); font-size: 20px; font-weight: 800;
      letter-spacing: 0.12em; color: var(--fc-black); line-height: 1.1;
    }
    .fc-logo-accent {
      color: var(--fc-accent);
      background: linear-gradient(135deg, #dfa26e 0%, #c28453 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .fc-logo-motto {
      font-size: 8px; font-weight: 700; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--fc-accent); opacity: 0.95;
      margin-top: 1px;
    }
    .fc-btn--primary {
      background: #0a382c; color: #faf9f6; border-color: #0a382c;
    }
    .fc-btn--primary:hover {
      background: #0f4c3c; border-color: #0f4c3c;
    }
    .fc-btn--secondary {
      background: linear-gradient(135deg, #dfa26e 0%, #c28453 100%);
      color: #0c1210; border-color: #c28453;
      box-shadow: 0 4px 15px rgba(194, 132, 83, 0.25);
    }
    .fc-btn--secondary:hover {
      background: linear-gradient(135deg, #c28453 0%, #985b2e 100%);
      color: #ffffff;
    }
    .fc-announcement {
      background: linear-gradient(90deg, #06241c 0%, #0a382c 50%, #06241c 100%);
      border-bottom: 1px solid rgba(194,132,83,0.3);
    }
    .fc-badge--new {
      background: #0a382c; color: #faf9f6;
    }
    .fc-badge--sale {
      background: #c28453; color: #0c1210; font-weight: 800;
    }
    .fc-discount-badge {
      background: rgba(194, 132, 83, 0.15); color: #985b2e; font-weight: 700;
    }
  </style>
</head>
<body>
  <div style="text-align:center;">
    <p style="font-size:22px;font-weight:800;letter-spacing:.12em;">FOLD<span style="color:#C28453;">CUT</span></p>
    <p style="font-size:.875rem;opacity:.5;margin-top:.5rem;">Redirecting…</p>
  </div>
  <script>window.location.href='/preview/index.html';</script>
</body>
</html>
