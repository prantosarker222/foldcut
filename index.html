<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="refresh" content="1; url=/preview/index.html"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FOLDCUT â€” Quality &bull; Comfort &bull; Confidence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #FFFFFF;
      color: #111827;
      overflow: hidden;
    }
    .splash-card {
      text-align: center;
      padding: 2.5rem;
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 440px;
    }
    .logo-frame {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08), 0 0 25px rgba(194, 132, 83, 0.25);
      border: 3px solid #C28453;
      animation: pulseGlow 3s infinite alternate ease-in-out;
      background: #FFFFFF;
    }
    .logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .brand-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      color: #111827;
    }
    .brand-title span {
      color: #C28453;
    }
    .brand-tagline {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #0A382C;
      opacity: 0.9;
      margin-bottom: 1.75rem;
    }
    .loader-bar {
      width: 160px;
      height: 3px;
      background: #F3F4F6;
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }
    .loader-progress {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 100%;
      background: linear-gradient(90deg, #0A382C, #C28453, #0A382C);
      animation: loading 1.2s ease-in-out infinite;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes pulseGlow {
      from { box-shadow: 0 10px 25px rgba(0,0,0,0.06), 0 0 15px rgba(194, 132, 83, 0.15); }
      to { box-shadow: 0 10px 35px rgba(0,0,0,0.12), 0 0 30px rgba(194, 132, 83, 0.4); }
    }
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="logo-frame">
      <img src="/assets/images/logo.jpg" alt="FOLDCUT Emblem" />
    </div>
    <h1 class="brand-title">FOLD<span>CUT</span></h1>
    <p class="brand-tagline">Quality &bull; Comfort &bull; Confidence</p>
    <div class="loader-bar">
      <div class="loader-progress"></div>
    </div>
  </div>
  <script>
    setTimeout(function() {
      window.location.href = '/preview/index.html';
    }, 600);
  </script>
</body>
</html>
